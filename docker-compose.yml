# One command runs the whole application: `docker compose up`.
#
# No Python, no Node, no virtualenv, no second terminal, and no API keys
# required to start. Keys are optional and only unlock the sources that need
# them; see the `environment` block on `backend` and the README.

services:
  postgres:
    image: postgres:16-alpine
    container_name: loom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom
    ports:
      - "5432:5432"
    volumes:
      - loom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A real SMTP server, running locally, that catches every message and shows
  # it in a browser inbox instead of sending it on.
  #
  # This is the honest answer to "configure an email server" for a tool that
  # must stay free and must work on a fresh clone. The alternatives both fail
  # one of those: a transactional provider needs an account and an API key
  # before anybody can sign in even once, and a real relay on a residential
  # address gets its mail refused or filed as spam by every large mailbox
  # provider, which is worse than not sending at all because it fails silently.
  #
  # Mail is genuinely delivered over SMTP here, so the application path is the
  # real one rather than a stub. Point SMTP_HOST at a provider when you want
  # messages to leave the machine; nothing in the app changes.
  mail:
    image: axllent/mailpit:latest
    container_name: loom-mail
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      # 8025 is the inbox in a browser. 1025 is SMTP, published so a host-side
      # script can use it too.
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: loom-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mail:
        condition: service_started
    environment:
      # Container-to-container, so the host name is the service name.
      DATABASE_URL: postgresql+psycopg://loom:loom@postgres:5432/loom

      # API keys are deliberately NOT listed here. They are mounted as files
      # into /run/secrets and read at runtime (see the volumes block below and
      # backend/app/config.py). Passing them as environment variables would put
      # them in `docker inspect` output and in /proc/1/environ, readable by
      # anything that can reach the Docker socket. Nothing is baked into the
      # image either way, but a file the process reads is a smaller exposure
      # than a variable the platform copies around.
      #
      # An environment variable still overrides a secret if you set one, which
      # keeps throwaway local runs and CI simple.

      # SEC enforces its fair-access policy through this header and is
      # stricter than its wording suggests: measured against sec.gov, the
      # User-Agent must contain an email-shaped token and must NOT contain a
      # URL, or every request returns 403. These defaults work as-is; replace
      # them with your own contact so SEC can reach a human about the traffic.
      SEC_EDGAR_USER_AGENT: ${SEC_EDGAR_USER_AGENT:-Loom research-tool loom@example.com}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-Loom research-tool loom@example.com}

      # Off by default in a fresh container: a first-time user should choose
      # when to spend their AI quota, not have a background job start doing it.
      # Sign-in codes go to the local mail catcher by default, so a fresh
      # clone can create an account without any configuration at all. Override
      # these to send through a real provider; the password belongs in
      # ./secrets/smtp_password rather than here, for the reason above.
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-loom}
      SMTP_FROM: ${SMTP_FROM:-Loom <no-reply@loom.local>}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      # Mailpit accepts any credentials; a real provider will not, and this is
      # the one value that should come from the secrets mount.
      SMTP_PASSWORD: ${SMTP_PASSWORD:-local}
      # STARTTLS is meaningless against a container on the same bridge and
      # fails outright, so it is off for the local catcher and on for anything
      # else.
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}

      # Accounts that get oversight of this instance: other accounts, and the
      # engine's internals. Everything else Loom does is available to every
      # account, because running the engine is the product rather than a
      # privilege.
      #
      # Kept here rather than in the database so it survives a reset. A "first
      # account wins" rule quietly hands a redeployed instance to whoever
      # registers first, which is the wrong default for something that can be
      # wiped and brought back.
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-yca}

      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      SCHEDULER_INTERVAL_MINUTES: ${SCHEDULER_INTERVAL_MINUTES:-360}

      # The live filing watcher. Separate switch from the scheduler because it
      # serves a different clock: the scheduler rebuilds a corpus every few
      # hours, while this notices an 8-K within a minute of EDGAR accepting
      # it. It costs one HTTP request per interval regardless of how many
      # companies are tracked, and no AI quota at all, so it is far cheaper to
      # leave running than the scheduler is.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WATCHER_ENABLED: ${WATCHER_ENABLED:-false}
      WATCHER_INTERVAL_SECONDS: ${WATCHER_INTERVAL_SECONDS:-60}
      LLM_MIN_CALL_INTERVAL_SECONDS: ${LLM_MIN_CALL_INTERVAL_SECONDS:-6.5}
      BLOB_STORE_DIR: /app/data/blobs
    volumes:
      # Secrets, read-only. A bind mount rather than compose's `secrets:`
      # primitive on purpose: that primitive fails the whole stack when a
      # secret file is missing, which would make a no-key install impossible.
      # An empty or absent directory here is simply a run with no keys.
      - ./secrets:/run/secrets:ro

      # Bind-mounted rather than a named volume, for two reasons: an existing
      # local checkout keeps working (document text already on disk is visible
      # to the container immediately), and the stored text stays inspectable
      # and backup-able on the host instead of hiding inside Docker. A fresh
      # clone just gets an empty directory, which is correct.
      - ./backend/data/blobs:/app/data/blobs
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: loom-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  loom_pgdata:
