server {
    listen 80;

    # Same-origin proxy, mirroring what the Vite dev server does locally (see
    # vite.config.ts). Keeping every request same-origin means CORS is never
    # involved and the browser never needs to know the backend's address.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
