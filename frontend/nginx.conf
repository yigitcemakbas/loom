server {
    listen 80;

    # Same-origin proxy, mirroring what the Vite dev server does locally (see
    # vite.config.ts). Keeping every request same-origin means CORS is never
    # involved and the browser never needs to know the backend's address.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Vite fingerprints these filenames with a content hash, so a given URL's
    # bytes never change and the browser can keep them forever. A new build
    # produces new filenames rather than new contents at the same name.
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # index.html is the one file whose URL stays the same while its
        # contents change, since it carries the <script> tag naming the current
        # hashed bundle. Served without this header it has no explicit freshness
        # information, so browsers fall back to heuristic caching and may reuse
        # it for hours without ever asking nginx. The visible symptom is a
        # rebuilt frontend that simply never arrives: the browser keeps
        # requesting the bundle the stale index.html named, and every change
        # ships to a user who cannot see it. "no-cache" still allows caching,
        # it just requires revalidation first, which the ETag makes cheap.
        add_header Cache-Control "no-cache";
    }
}
