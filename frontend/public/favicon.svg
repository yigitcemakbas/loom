<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Same geometry as components/layout/LoomMark.tsx, measured off the supplied
       artwork: thread 7.5 on a pitch of 20, flat ends, the two coloured threads
       running longer than the four neutral ones. -->
  <rect width="100" height="100" fill="#0e1013"/>
  <g stroke-width="7.5" stroke-linecap="butt">
    <line x1="11" y1="30" x2="89" y2="30" stroke="#e6e6e4"/>
    <line x1="6"  y1="50" x2="94" y2="50" stroke="#e0524a"/>
    <line x1="11" y1="70" x2="89" y2="70" stroke="#e6e6e4"/>
    <line x1="30" y1="11" x2="30" y2="89" stroke="#e6e6e4"/>
    <line x1="50" y1="6"  x2="50" y2="94" stroke="#35c46b"/>
    <line x1="70" y1="11" x2="70" y2="89" stroke="#e6e6e4"/>
    <line x1="22.5" y1="30" x2="37.5" y2="30" stroke="#e6e6e4"/>
    <line x1="62.5" y1="30" x2="77.5" y2="30" stroke="#e6e6e4"/>
    <line x1="42.5" y1="50" x2="57.5" y2="50" stroke="#e0524a"/>
    <line x1="22.5" y1="70" x2="37.5" y2="70" stroke="#e6e6e4"/>
    <line x1="62.5" y1="70" x2="77.5" y2="70" stroke="#e6e6e4"/>
  </g>
</svg>
