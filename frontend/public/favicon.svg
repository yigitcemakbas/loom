<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The Loom mark: three warp threads, three weft, woven. Same geometry as
       components/layout/LoomMark.tsx, kept in step by hand because a favicon
       cannot read a React component. Colours are fixed here rather than
       inherited: a browser tab has no theme to inherit from. -->
  <rect width="100" height="100" fill="#0e1013"/>
  <g stroke-width="11" stroke-linecap="round">
    <!-- weft -->
    <line x1="9" y1="30" x2="91" y2="30" stroke="#e6e6e4"/>
    <line x1="9" y1="50" x2="91" y2="50" stroke="#e0524a"/>
    <line x1="9" y1="70" x2="91" y2="70" stroke="#e6e6e4"/>
    <!-- warp -->
    <line x1="30" y1="9" x2="30" y2="91" stroke="#e6e6e4"/>
    <line x1="50" y1="9" x2="50" y2="91" stroke="#35c46b"/>
    <line x1="70" y1="9" x2="70" y2="91" stroke="#e6e6e4"/>
    <!-- weft segments that pass over, giving the interlace -->
    <line x1="19" y1="30" x2="41" y2="30" stroke="#e6e6e4"/>
    <line x1="59" y1="30" x2="81" y2="30" stroke="#e6e6e4"/>
    <line x1="39" y1="50" x2="61" y2="50" stroke="#e0524a"/>
    <line x1="19" y1="70" x2="41" y2="70" stroke="#e6e6e4"/>
    <line x1="59" y1="70" x2="81" y2="70" stroke="#e6e6e4"/>
  </g>
</svg>
