<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Lato, self-described weights only. preconnect because the font blocks
         first paint of every label in the interface. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <title>Loom</title>
  </head>
  <body>
    <!-- Resolve the theme before first paint.
         The stylesheet defines dark under [data-theme="dark"] alone, so the
         system preference has to become an explicit attribute, and it has to
         happen here rather than in React: resolving it after hydration shows
         every dark-mode user a flash of the light palette on every load. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("loom.theme");
          var system = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme =
            stored === "dark" || stored === "light" ? stored : system ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
